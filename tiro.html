<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020403">
<title>PHANTASMA // FASE FINAL</title>
<style>
:root{
  --bg:#020403;
  --text:#edf4ef;
  --muted:#68736c;
  --green:#7cf0a7;
  --red:#ff626b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{
  min-height:100dvh;overflow:hidden;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
.bg{
  position:fixed;inset:-7%;z-index:-5;
  background:
    linear-gradient(rgba(2,4,3,.78),rgba(2,4,3,.94)),
    url("assets/phantasma-bg.jpg") center/cover no-repeat;
  transform:scale(1.08);
  animation:bgDrift 28s ease-in-out infinite alternate;
}
@keyframes bgDrift{
  from{transform:scale(1.08) translate3d(-1%,-.7%,0)}
  to{transform:scale(1.13) translate3d(1%,.7%,0)}
}
.grid{
  position:fixed;inset:0;z-index:-4;opacity:.055;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:48px 48px;
}
.scanlines{
  position:fixed;inset:0;z-index:-3;pointer-events:none;opacity:.05;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 4px);
}
.vignette{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(circle at 50% 46%,transparent 0 32%,rgba(0,0,0,.3) 67%,rgba(0,0,0,.86) 100%);
}
#noiseCanvas{
  position:fixed;inset:0;z-index:-1;width:100%;height:100%;opacity:.14;pointer-events:none;
}

/* boot */
#boot{
  position:fixed;inset:0;display:grid;place-items:center;padding:24px;
  transition:opacity .45s ease,filter .45s ease;
}
#boot.fade{opacity:.18;filter:blur(1.5px)}
.boot-inner{width:min(720px,100%)}
.boot-kicker{
  margin-bottom:16px;color:#56635b;font-size:9px;letter-spacing:.22em;text-transform:uppercase;
}
#bootText{
  min-height:42px;color:#eef5f0;font-size:clamp(17px,2.2vw,25px);
  letter-spacing:.08em;text-transform:uppercase;
}
#bootSub{
  min-height:28px;margin-top:10px;color:#657169;font-size:10px;
  letter-spacing:.15em;text-transform:uppercase;
}
.boot-line{
  position:relative;width:100%;height:1px;margin-top:28px;overflow:hidden;
  background:rgba(219,234,225,.08);
}
.boot-line::after{
  content:"";position:absolute;inset:0 auto 0 -30%;width:30%;
  background:linear-gradient(90deg,transparent,rgba(124,240,167,.75),transparent);
  animation:bootSweep 1.05s ease-in-out infinite;
}
@keyframes bootSweep{to{left:100%}}

/* decode overlay */
#decodeLayer{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(18px,4vw,42px);
  background:rgba(1,3,2,.50);
  backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .38s ease,visibility .38s ease;
}
#decodeLayer.show{opacity:1;visibility:visible;pointer-events:auto}
.decode-window{
  position:relative;width:min(940px,100%);min-height:520px;
  padding:clamp(22px,4vw,44px);overflow:hidden;
  border:1px solid rgba(220,235,226,.14);
  background:linear-gradient(180deg,rgba(7,11,8,.96),rgba(3,6,4,.97));
  box-shadow:0 34px 90px rgba(0,0,0,.52),inset 0 1px rgba(255,255,255,.025);
  opacity:0;transform:translateY(16px) scale(.992);filter:blur(3px);
  transition:
    opacity .46s cubic-bezier(.2,.8,.2,1),
    transform .46s cubic-bezier(.2,.8,.2,1),
    filter .46s ease;
}
#decodeLayer.show .decode-window{opacity:1;transform:none;filter:none}
.decode-window::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(124,240,167,.48),transparent);
}
.decode-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-bottom:18px;border-bottom:1px solid rgba(220,235,226,.08);
}
.decode-title{
  color:#dce7e0;font-size:10px;letter-spacing:.20em;text-transform:uppercase;
}
.decode-led{
  display:flex;align-items:center;gap:8px;color:#5e6a63;font-size:9px;
  letter-spacing:.15em;text-transform:uppercase;
}
.decode-led::before{
  content:"";width:6px;height:6px;border-radius:50%;
  background:var(--green);box-shadow:0 0 12px rgba(124,240,167,.38);
  animation:led 1.1s ease-in-out infinite;
}
@keyframes led{50%{opacity:.25}}

.decode-center{
  min-height:390px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;gap:44px;
}
.slot-line{
  display:flex;justify-content:center;align-items:center;
  gap:clamp(5px,1.2vw,14px);min-height:72px;user-select:none;
}
.slot-gap{width:clamp(12px,2vw,28px)}
.slot-dot{
  width:clamp(10px,1.4vw,18px);color:#859188;
  font-size:clamp(20px,3vw,38px);
}
.reel{
  position:relative;width:clamp(24px,3.8vw,45px);
  height:clamp(48px,6.5vw,74px);overflow:hidden;
}
.reel-track{position:absolute;left:0;top:0;width:100%;will-change:transform}
.reel-char{
  width:100%;height:clamp(48px,6.5vw,74px);
  display:flex;align-items:center;justify-content:center;
  color:#f0f6f2;
  font-family:Inter,ui-sans-serif,system-ui,sans-serif;
  font-weight:720;font-size:clamp(28px,5.2vw,58px);
  letter-spacing:-.04em;text-shadow:0 0 15px rgba(124,240,167,.08);
}
.date .reel{
  width:clamp(21px,3.1vw,38px);height:clamp(40px,5.4vw,62px);
}
.date .reel-char{
  height:clamp(40px,5.4vw,62px);font-size:clamp(23px,4.2vw,45px);font-weight:640;
}
#decodeStatus{
  min-height:22px;color:#78857d;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
}
.progress{width:min(520px,82%);margin-top:-26px}
.progress-track{height:1px;background:rgba(220,235,226,.10);overflow:hidden}
#progressBar{
  width:0%;height:100%;
  background:linear-gradient(90deg,rgba(124,240,167,.12),rgba(124,240,167,.8));
  transition:width .55s cubic-bezier(.2,.8,.2,1);
}
#progressText{
  margin-top:10px;text-align:right;color:#59665e;font-size:9px;letter-spacing:.14em;
}

/* glitch */
#glitchFlash{
  position:fixed;inset:0;z-index:100;pointer-events:none;opacity:0;
  background:
    linear-gradient(90deg,rgba(255,0,60,.13),transparent 24%,rgba(124,240,167,.11) 76%,transparent),
    rgba(255,255,255,.03);
}
#glitchFlash.hit{animation:glitchHit .23s steps(2,end)}
@keyframes glitchHit{
  0%{opacity:0}
  20%{opacity:.82;transform:translateX(-6px)}
  45%{opacity:.18;transform:translateX(7px)}
  70%{opacity:.42;transform:translateX(-2px)}
  100%{opacity:0;transform:none}
}

/* provisório: payoff ainda vai ser lapidado */
#provocation{
  position:absolute;inset:0;z-index:4;
  display:flex;align-items:center;justify-content:center;
  padding:30px;background:rgba(3,6,4,.96);
  opacity:0;visibility:hidden;
  transition:opacity .4s ease,visibility .4s ease;
}
#provocation.show{opacity:1;visibility:visible}
.prov-inner{width:min(650px,100%);text-align:center}
#provMain{
  color:#f2f6f3;font-family:Inter,ui-sans-serif,system-ui,sans-serif;
  font-size:clamp(34px,6vw,72px);font-weight:740;letter-spacing:-.045em;
}
#provSub{
  margin-top:20px;color:#8a968e;font-size:12px;line-height:1.9;white-space:pre-line;
}
#continueBase{
  display:none;margin:34px auto 0;min-height:46px;padding:0 19px;
  border:1px solid rgba(220,235,226,.18);background:transparent;color:#dbe5df;
  font:inherit;font-size:10px;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;
}
#continueBase.show{display:inline-flex;align-items:center}

@media(max-width:640px){
  .decode-window{min-height:500px;padding:20px 14px}
  .decode-head{align-items:flex-start;flex-direction:column;gap:8px}
  .decode-center{min-height:370px;gap:36px}
  .slot-line{gap:4px}
  .slot-gap{width:10px}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="scanlines"></div>
<div class="vignette"></div>
<canvas id="noiseCanvas"></canvas>

<div id="boot">
  <div class="boot-inner">
    <div class="boot-kicker">PHANTASMA // PROCESSAMENTO</div>
    <div id="bootText">CARREGANDO...</div>
    <div id="bootSub">sincronizando registros</div>
    <div class="boot-line"></div>
  </div>
</div>

<div id="decodeLayer" aria-hidden="true">
  <section class="decode-window">
    <header class="decode-head">
      <div class="decode-title">ARQUIVO RECUPERADO // ACESSO RESTRITO</div>
      <div class="decode-led">canal seguro</div>
    </header>

    <div class="decode-center">
      <div id="nameSlots" class="slot-line" aria-label="identificação criptografada"></div>

      <div id="dateSlots" class="slot-line date" aria-label="data criptografada"></div>

      <div id="decodeStatus">DECODIFICANDO...</div>

      <div class="progress">
        <div class="progress-track"><div id="progressBar"></div></div>
        <div id="progressText">0%</div>
      </div>
    </div>

    <div id="provocation">
      <div class="prov-inner">
        <div id="provMain">99%.</div>
        <div id="provSub">A provocação ainda está em aberto.
Esta tela está aqui só para fecharmos primeiro o ritmo da falsa revelação.</div>
        <button id="continueBase" type="button">CONTINUAR BASE</button>
      </div>
    </div>
  </section>
</div>

<div id="glitchFlash"></div>

<script>
(() => {
"use strict";

/*
  ==========================================================
  BASE DA ABERTURA DA FASE FINAL

  IMPORTANTE:
  Não existe nome verdadeiro ou data verdadeira neste código.
  Os roletes usam SOMENTE os pools aleatórios abaixo.
  ==========================================================
*/

const LETTER_POOL = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789#%?@&+";
const NUMBER_POOL = "0123456789";

const BOOT_SEQUENCE = [
  {at:0,    main:"CARREGANDO...",                 sub:"sincronizando registros"},
  {at:1500, main:"LOCALIZANDO ARQUIVOS...",       sub:"varredura em andamento"},
  {at:3100, main:"ARQUIVO ENCONTRADO",            sub:"origem // protegida"},
  {at:4300, main:"DECODIFICAÇÃO INICIADA",        sub:"tentando acesso"}
];

const PROGRESS_SEQUENCE = [
  [900,12],
  [1600,29],
  [2350,43],
  [3100,61],
  [3850,76],
  [4550,88],
  [5250,94],
  [6000,97],
  [6800,98],
  [7600,99]
];

const $ = id => document.getElementById(id);
const boot = $("boot");
const bootText = $("bootText");
const bootSub = $("bootSub");
const decodeLayer = $("decodeLayer");
const nameSlots = $("nameSlots");
const dateSlots = $("dateSlots");
const decodeStatus = $("decodeStatus");
const progressBar = $("progressBar");
const progressText = $("progressText");
const glitchFlash = $("glitchFlash");
const provocation = $("provocation");
const continueBase = $("continueBase");

let reelControllers = [];
let decodingStarted = false;

function glitch(){
  glitchFlash.classList.remove("hit");
  void glitchFlash.offsetWidth;
  glitchFlash.classList.add("hit");
}

function randomChar(pool){
  return pool[Math.floor(Math.random()*pool.length)];
}

/*
  Cada slot é um rolete vertical:
  o caractere antigo sobe e o próximo entra por baixo.
*/
function createReel(pool, speedMin=55, speedMax=115){
  const reel = document.createElement("span");
  reel.className = "reel";

  const track = document.createElement("span");
  track.className = "reel-track";

  const a = document.createElement("span");
  const b = document.createElement("span");
  a.className = b.className = "reel-char";

  a.textContent = randomChar(pool);
  b.textContent = randomChar(pool);

  track.append(a,b);
  reel.append(track);

  const ctrl = {
    reel,track,a,b,pool,
    timer:null,
    running:true,
    duration:speedMin + Math.random()*(speedMax-speedMin)
  };

  function cycle(){
    if(!ctrl.running) return;

    const h = reel.clientHeight || 60;
    ctrl.b.textContent = randomChar(ctrl.pool);

    ctrl.track.style.transition =
      `transform ${ctrl.duration}ms cubic-bezier(.2,.75,.25,1)`;
    ctrl.track.style.transform = `translateY(-${h}px)`;

    setTimeout(()=>{
      if(!ctrl.running) return;

      ctrl.a.textContent = ctrl.b.textContent;
      ctrl.track.style.transition = "none";
      ctrl.track.style.transform = "translateY(0)";
      ctrl.b.textContent = randomChar(ctrl.pool);

      ctrl.duration = speedMin + Math.random()*(speedMax-speedMin);
      ctrl.timer = setTimeout(cycle,18 + Math.random()*95);
    },ctrl.duration + 8);
  }

  ctrl.start = ()=>cycle();
  ctrl.stop = ()=>{
    ctrl.running = false;
    clearTimeout(ctrl.timer);
    ctrl.track.style.transition = "none";
    ctrl.track.style.transform = "translateY(0)";
  };

  reelControllers.push(ctrl);
  return ctrl;
}

function separator(type){
  const el = document.createElement("span");
  if(type === "gap"){
    el.className = "slot-gap";
  }else{
    el.className = "slot-dot";
    el.textContent = ".";
  }
  return el;
}

/* ----- -- -- -- */
function buildNameSlots(){
  const groups = [5,2,2,2];

  groups.forEach((count,g)=>{
    for(let i=0;i<count;i++){
      const ctrl = createReel(LETTER_POOL,48,105);
      nameSlots.append(ctrl.reel);
    }
    if(g<groups.length-1){
      nameSlots.append(separator("gap"));
    }
  });
}

/* -- . -- . ---- */
function buildDateSlots(){
  const groups = [2,2,4];

  groups.forEach((count,g)=>{
    for(let i=0;i<count;i++){
      const ctrl = createReel(NUMBER_POOL,44,100);
      dateSlots.append(ctrl.reel);
    }
    if(g<groups.length-1){
      dateSlots.append(separator("dot"));
    }
  });
}

function startReels(){
  reelControllers.forEach((ctrl,i)=>{
    setTimeout(()=>ctrl.start(),Math.random()*180 + i*8);
  });
}

function stopReels(){
  reelControllers.forEach(ctrl=>ctrl.stop());
}

function updateProgress(value){
  progressBar.style.width = value+"%";
  progressText.textContent = value+"%";
}

function beginDecode(){
  if(decodingStarted) return;
  decodingStarted = true;

  boot.classList.add("fade");

  setTimeout(()=>{
    decodeLayer.classList.add("show");
    decodeLayer.setAttribute("aria-hidden","false");
    glitch();
    startReels();

    PROGRESS_SEQUENCE.forEach(([ms,value])=>{
      setTimeout(()=>updateProgress(value),ms);
    });

    setTimeout(()=>{
      decodeStatus.textContent = "DECODIFICAÇÃO // 99%";
      glitch();
    },8000);

    setTimeout(()=>{
      decodeStatus.textContent = "DECODIFICAÇÃO // INTERROMPIDA";
      progressText.textContent = "99%";
      glitch();

      setTimeout(()=>{
        stopReels();
        glitch();

        setTimeout(()=>{
          provocation.classList.add("show");
          continueBase.classList.add("show");
        },500);
      },800);
    },10100);
  },360);
}

BOOT_SEQUENCE.forEach(step=>{
  setTimeout(()=>{
    bootText.textContent = step.main;
    bootSub.textContent = step.sub;

    if(step.main === "ARQUIVO ENCONTRADO"){
      glitch();
    }

    if(step.main === "DECODIFICAÇÃO INICIADA"){
      setTimeout(beginDecode,700);
    }
  },step.at);
});

/*
  Botão provisório.
  Ainda não inicia o jogo porque primeiro estamos lapidando esta abertura.
*/
continueBase.addEventListener("click",()=>{
  provocation.classList.remove("show");
  decodeStatus.textContent = "BASE DA ABERTURA // CONCLUÍDA";
  continueBase.classList.remove("show");
});

/* ruído sutil */
const canvas = $("noiseCanvas");
const ctx = canvas.getContext("2d");
let noiseTimer = 0;

function resizeNoise(){
  const dpr=Math.min(devicePixelRatio||1,1.25);
  canvas.width=Math.floor(innerWidth*dpr);
  canvas.height=Math.floor(innerHeight*dpr);
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function drawNoise(now){
  if(now-noiseTimer>90){
    noiseTimer=now;
    ctx.clearRect(0,0,innerWidth,innerHeight);

    for(let i=0;i<45;i++){
      const x=Math.random()*innerWidth;
      const y=Math.random()*innerHeight;
      const w=8+Math.random()*55;
      ctx.fillStyle=`rgba(150,255,193,${Math.random()*.025})`;
      ctx.fillRect(x,y,w,1);
    }
  }
  requestAnimationFrame(drawNoise);
}

buildNameSlots();
buildDateSlots();
resizeNoise();
requestAnimationFrame(drawNoise);
addEventListener("resize",resizeNoise);

})();
</script>
</body>
</html>
