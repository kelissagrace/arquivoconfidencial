<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050806">
<title>Teste // PHANTASMA</title>

<style>
:root{
  --bg:#040705;
  --text:#eef5f0;
  --muted:#7c8982;
  --soft:#c6d2ca;
  --line:rgba(220,235,226,.12);
  --line2:rgba(220,235,226,.22);
  --red:#ff5f68;
  --green:#74e99f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{
  min-height:100dvh;
  overflow-x:hidden;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
button,input{font:inherit}

.bg{
  position:fixed;inset:-5%;z-index:-5;
  background:
    linear-gradient(rgba(2,5,4,.72),rgba(2,5,4,.89)),
    url("assets/phantasma-bg.jpg") center/cover no-repeat;
  transform:scale(1.08);
  animation:bgDrift 24s ease-in-out infinite alternate;
}
@keyframes bgDrift{
  from{transform:scale(1.08) translate3d(-1.2%,-.8%,0)}
  to{transform:scale(1.13) translate3d(1.4%,1%,0)}
}
#binaryCanvas{
  position:fixed;inset:0;z-index:-4;pointer-events:none;
  opacity:.17;mix-blend-mode:screen;
}
.scanlines{
  position:fixed;inset:0;z-index:-3;pointer-events:none;opacity:.08;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.025) 3px 4px);
}
.vignette{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(circle at 50% 46%,transparent 0 28%,rgba(0,0,0,.22) 62%,rgba(0,0,0,.78) 100%);
}
#glitchFlash{
  position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0;
  background:
    linear-gradient(90deg,rgba(255,0,60,.14),transparent 24%,rgba(117,255,180,.11) 74%,transparent),
    rgba(255,255,255,.03);
}
#glitchFlash.hit{animation:glitch .25s steps(2,end)}
@keyframes glitch{
  0%{opacity:0}
  20%{opacity:.9;transform:translateX(-7px)}
  45%{opacity:.24;transform:translateX(8px)}
  70%{opacity:.52;transform:translateX(-3px)}
  100%{opacity:0;transform:none}
}

.shell{
  min-height:100dvh;
  display:flex;flex-direction:column;
  padding:max(18px,env(safe-area-inset-top)) clamp(18px,4vw,56px) max(20px,env(safe-area-inset-bottom));
}
.topbar{
  width:min(1240px,100%);
  margin:0 auto;
  min-height:58px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex;align-items:center;gap:11px;
  color:#d8e2dc;font-size:11px;letter-spacing:.20em;text-transform:uppercase;
}
.brand-dot{
  width:7px;height:7px;border-radius:50%;background:var(--red);
  box-shadow:0 0 14px rgba(255,95,104,.58);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.38;box-shadow:0 0 5px rgba(255,95,104,.28)}}
#watchState{
  color:#75827a;font-size:10px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;
}

main{
  width:min(1120px,100%);
  margin:auto;
  padding:56px 0 70px;
}
.stage{
  min-height:min(650px,72dvh);
  display:flex;flex-direction:column;justify-content:center;
}
.kicker{
  margin-bottom:26px;
  color:rgba(180,199,188,.48);
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;
}
.question-wrap{
  position:relative;
  padding-left:26px;
}
.question-wrap::before{
  content:"";
  position:absolute;left:0;top:3px;bottom:3px;width:2px;
  background:linear-gradient(var(--red),rgba(255,95,104,.08));
}
#question{
  margin:0;
  max-width:980px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:clamp(34px,5.4vw,74px);
  line-height:1.02;
  font-weight:720;
  letter-spacing:-.045em;
  text-wrap:balance;
}
.sub{
  margin:22px 0 0;
  color:rgba(201,216,207,.45);
  font-size:12px;line-height:1.7;
}

.answer-zone{
  margin-top:52px;
  width:min(900px,100%);
}
.answer-line{
  display:grid;
  grid-template-columns:28px minmax(0,1fr) 142px;
  align-items:center;
  gap:12px;
  border-bottom:1px solid rgba(223,236,228,.27);
  transition:border-color .2s,box-shadow .2s;
}
.answer-line:focus-within{
  border-bottom-color:rgba(219,236,225,.62);
  box-shadow:0 10px 22px -20px rgba(187,255,216,.34);
}
.prompt{
  color:var(--green);
  font-size:20px;
  padding-bottom:4px;
}
#answer{
  width:100%;height:62px;border:0;outline:none;background:transparent;
  color:var(--text);padding:0 4px;font-size:16px;caret-color:var(--red);
}
#answer::placeholder{color:#5f6b64;letter-spacing:.03em}
#answer:disabled{opacity:.5}

#submit{
  height:44px;
  border:1px solid rgba(222,235,227,.22);
  background:rgba(226,235,229,.92);
  color:#101511;
  cursor:pointer;
  letter-spacing:.12em;text-transform:uppercase;font-size:10px;font-weight:850;
  transition:background .18s,color .18s,border-color .18s,box-shadow .18s,transform .12s,opacity .18s;
}
#submit:hover{filter:brightness(1.04)}
#submit:active{transform:translateY(1px)}
#submit:disabled{cursor:default}
#submit.state-correct{
  background:var(--green);border-color:var(--green);color:#07110b;
  box-shadow:0 0 24px rgba(116,233,159,.28);
}
#submit.state-wrong{
  background:var(--red);border-color:var(--red);color:#180608;
  box-shadow:0 0 24px rgba(255,95,104,.28);
}

#reaction{
  min-height:118px;
  margin-top:27px;
  padding:19px 0 0 26px;
  border-top:1px solid rgba(218,234,224,.09);
  color:var(--soft);
  line-height:1.78;font-size:14px;white-space:pre-line;
}
#reaction::before{
  content:"PHANTASMA //";
  display:block;
  margin-bottom:10px;
  color:#66736c;
  font-size:9px;letter-spacing:.20em;
}
#reaction:empty::after{content:"aguardando resposta.";color:#546059}
#reaction.bad{color:#f1b7ba}
#reaction.good{color:#d7e8dd}

.footer-meta{
  margin-top:22px;
  display:flex;gap:18px;flex-wrap:wrap;
  color:#5f6b64;
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;
}

.shake{animation:shake .27s linear}
@keyframes shake{
  20%{transform:translateX(-5px)}
  45%{transform:translateX(4px)}
  70%{transform:translateX(-2px)}
  90%{transform:translateX(2px)}
}

#final{display:none;width:min(1120px,100%);margin:auto}
#final.show{display:block}
#quizView.hidden{display:none}
.final-stage{
  min-height:min(650px,72dvh);
  display:flex;align-items:center;
}
.final-inner{width:min(920px,100%)}
.final-kicker{
  color:var(--red);
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:22px;
}
#finalText{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:clamp(32px,5vw,64px);
  line-height:1.1;white-space:pre-line;font-weight:680;letter-spacing:-.04em;
}
#finalStats{
  margin-top:30px;
  color:#68756e;font-size:10px;line-height:1.9;letter-spacing:.10em;text-transform:uppercase;
}
#nextBtn{
  margin-top:30px;min-height:48px;padding:0 22px;
  background:transparent;border:1px solid rgba(218,234,224,.22);
  color:#dce6e0;cursor:pointer;letter-spacing:.12em;text-transform:uppercase;font-size:10px;
}
#nextMessage{margin-top:14px;color:#748078;font-size:10px;letter-spacing:.09em}

#absence{
  position:fixed;left:18px;bottom:max(16px,env(safe-area-inset-bottom));z-index:30;
  max-width:min(420px,calc(100vw - 36px));padding:10px 12px;
  border-left:2px solid rgba(255,95,104,.5);
  background:rgba(4,6,5,.84);color:#87938c;font-size:10px;letter-spacing:.08em;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s;
}
#absence.show{opacity:1;transform:none}

@media(max-width:700px){
  .topbar{min-height:52px}
  .brand{font-size:10px}
  #watchState{display:none}
  main{padding:34px 0 48px}
  .stage{min-height:74dvh}
  .question-wrap{padding-left:18px}
  #question{font-size:clamp(32px,10vw,48px)}
  .answer-zone{margin-top:42px}
  .answer-line{grid-template-columns:22px minmax(0,1fr);gap:8px}
  #submit{grid-column:1/-1;width:100%;height:48px;margin-top:8px}
  #reaction{padding-left:18px;min-height:132px;font-size:13px}
}
</style>

</head>
<body>

<div class="bg"></div>
<canvas id="binaryCanvas" aria-hidden="true"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>
<div id="glitchFlash"></div>

<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><span>PHANTASMA // TESTE DE CONHECIMENTO</span></div>
    <div id="watchState">OBSERVAÇÃO // ATIVA</div>
  </header>

  <main id="quizView">
    <section id="card" class="stage">
      <div class="kicker">teste desbloqueado // resposta livre</div>

      <div class="question-wrap">
        <h1 id="question"></h1>
        <p class="sub">Responda. Eu percebo quando você desaparece.</p>
      </div>

      <div class="answer-zone">
        <form id="form" class="answer-line" autocomplete="off">
          <span class="prompt">&gt;</span>
          <input id="answer" type="text" inputmode="text" autocapitalize="off" spellcheck="false" placeholder="digite sua resposta">
          <button id="submit" type="submit">VALIDAR</button>
        </form>

        <div id="reaction" aria-live="polite"></div>

        <div class="footer-meta">
          <span id="errorCount">falhas // 0</span>
          <span id="awayCount">ausências // 0</span>
          <span>validação // local</span>
        </div>
      </div>
    </section>
  </main>

  <section id="final">
    <div class="final-stage">
      <div class="final-inner">
        <div class="final-kicker">teste concluído</div>
        <div id="finalText"></div>
        <div id="finalStats"></div>
        <button id="nextBtn">PRÓXIMO TESTE</button>
        <div id="nextMessage"></div>
      </div>
    </div>
  </section>
</div>

<div id="absence">SESSÃO // AUSÊNCIA REGISTRADA</div>

<audio id="sfxClick" preload="auto" src="assets/sfx/click.wav"></audio>
<audio id="sfxError" preload="auto" src="assets/sfx/erro.wav"></audio>
<audio id="sfxAccess" preload="auto" src="assets/sfx/acesso.wav"></audio>

<script>
(() => {
  "use strict";
  const NEXT_PAGE = "";

  const QUESTIONS = [
    { id:"westbridge-shooter", question:"Qual é o nome do atirador de Westbrigde?", accepted:["luke","luke hancey"], type:"text" },
    { id:"charlotte-necklace", question:"Qual o valor do colar que o Killian compra no leilão da Charlotte?", accepted:[], type:"money200k" },
    { id:"ivy-capsule", question:"Qual era o desenho dentro da cápsula da Ivy?", accepted:["medusa"], type:"text" }
  ];

  const TAUNTS = {
    correctFirst:[
      "Hm.\nEntão você prestou atenção.\nNão se empolgue.",
      "Certo.\nEra o mínimo, mas certo.",
      "Uma resposta correta.\nTente não transformar isso em um evento.",
      "Muito bem.\nAinda não estou impressionado."
    ],
    correctSecond:[
      "De novo?\nEstou começando a achar isso inconveniente.",
      "Duas respostas certas.\nQue desagradável.",
      "Olha só.\nTalvez os livros não tenham sido apenas decoração.",
      "Você está tornando isso menos divertido para mim."
    ],
    correctThird:[
      "Que irritante.",
      "Três respostas.\nNenhum tropeço.",
      "Parece que subestimei você.",
      "Três de três. Limpo.\nQue inconveniente."
    ],

    firstWrongQ1:[
      "Ah.\nIsso foi rápido.",
      "Nem deu tempo de eu criar expectativas.",
      "Primeira pergunta.\nImpressionante.",
      "Começamos muito bem.\nPara mim, pelo menos.",
      "Você conseguiu tropeçar antes da caminhada começar."
    ],
    firstWrongQ2:[
      "Estava indo tão bem.",
      "Por alguns segundos eu quase acreditei em você.",
      "Ah.\nA sequência perfeita durou pouco.",
      "Uma certa, uma errada.\nVoltamos a uma realidade mais confortável."
    ],
    firstWrongQ3:[
      "Sério?\nVocê chegou até aqui para errar agora?",
      "Você chegou até aqui para errar agora?\nQue timing impecável.",
      "Duas perfeitas e você escolhe justamente agora para desmoronar.",
      "Tão perto.\nDeve ser irritante."
    ],

    secondWrong:[
      "Quer que eu espere você reler os quatro livros?",
      "Vai com calma.\nTemos todo o tempo do mundo. Aparentemente você precisa.",
      "Segunda tentativa.\nMesmo resultado intelectual.",
      "Talvez ler a pergunta novamente seja um começo."
    ],
    thirdWrong:[
      "Posso procurar um resumo para você também.\nTalvez um com figuras.",
      "Estamos oficialmente transformando isso numa investigação.",
      "Você sabe que chutar repetidamente não transforma uma resposta em correta, certo?",
      "Estou começando a achar que você leu outros quatro livros."
    ],
    fourthPlus:[
      "A essa altura eu já não sei se você está tentando responder ou me entreter.",
      "Continue.\nIsso começou como teste e virou estudo de caso.",
      "Eu poderia diminuir a dificuldade.\nMas aí teríamos que fingir que isso ainda é um teste.",
      "Vocês discutem esses livros com tanta convicção na internet.\nFascinante.",
      "Quatro livros.\nQuatro.\nE ainda estamos aqui.",
      "Não tenha pressa.\nOs segredos provavelmente conseguem esperar mais alguns minutos."
    ],

    clay:[
      "Quer que eu chame o detetive Clay para te ajudar?",
      "Detetive Clay teria orgulho de você.\nNão interprete isso como elogio.",
      "Você e o detetive Clay a 500 km de distância disputando o título de mais incompetente.",
      "A diferença entre você e o detetive Clay é que você já leu quatro livros e sabe de tudo.\nEle não.",
      "Clay pelo menos tem a desculpa de não ter lido os quatro livros.\nQual é a sua?",
      "Em algum lugar, o detetive Clay acabou de se sentir estranhamente competente.",
      "Você conseguiu fazer o detetive Clay parecer eficiente.\nIsso é quase um talento.",
      "Se continuar assim, vou chamar Clay.\nTalvez dois investigadores ruins formem um bom."
    ],

    afterFewErrors:[
      "Aí está.\nEventualmente.",
      "Viu?\nNão precisava tornar isso tão dramático.",
      "Correto.\nNa segunda tentativa, mas não sejamos exigentes.",
      "Chegou lá.\nPelo caminho turístico."
    ],
    afterManyErrors:[
      "Conseguiu.\nEventualmente.",
      "Demorou tanto que eu quase esqueci a pergunta.",
      "Correto.\nDepois de algumas tentativas demais para eu chamar isso de conhecimento.",
      "Persistência: excelente.\nMemória: discutível.",
      "Tecnicamente certo.\nVamos evitar falar sobre o caminho até aqui.",
      "Parabéns.\nVocê venceu a pergunta por exaustão.",
      "Viu?\nNem precisei esperar você reler os quatro livros.\nSó quase."
    ],

    awayShort:[
      "Foi dar uma volta?",
      "Eu percebi.",
      "Precisou pensar longe de mim?",
      "Voltou.\nQue bom."
    ],
    awayLong:[
      "Demorou.",
      "Precisou de um tempo para… refletir?",
      "Interessante.\nA pergunta ficou mais fácil enquanto você estava fora?",
      "Você sabe que eu percebo quando você vai embora, certo?"
    ],
    awayWrong:[
      "Você saiu, voltou e essa ainda é sua resposta?",
      "Eu realmente esperava algum progresso depois daquela pequena excursão.",
      "Todo aquele tempo fora para chegar exatamente no lugar errado.",
      "Isso tornou a saída ainda mais constrangedora.",
      "Você saiu, investigou e voltou com isso?\nDetetive Clay teria orgulho de você."
    ],
    awayCorrect:[
      "Ah.\nInteressante como a resposta apareceu depois daquela pequena ausência.",
      "Precisava apenas de alguns segundos de inspiração, imagino.",
      "Que conveniente.",
      "Uma pequena investigação paralela?\nClay teria orgulho.\nBem… talvez não. Ele provavelmente reclamaria primeiro."
    ],
    awayRepeated:[
      "Continue entrando e saindo.\nTenho certeza de que a resposta vai aparecer magicamente.",
      "Você pretende responder ou transformar isso em trabalho de campo?",
      "Mais uma viagem?",
      "Estou começando a contabilizar suas fugas.",
      "Vai.\nEu espero.\nClaramente isso está funcionando muito bem.",
      "Nesse ritmo, você e o detetive Clay podem abrir uma agência juntos."
    ],

    finalPerfect:[
      "Três de três. Limpo.\nQue inconveniente.\n\nVamos ver se continua tão confiante quando conhecimento deixar de ser suficiente.",
      "Três respostas.\nNenhum erro.\nInteressante.\n\nTalvez você realmente saiba alguma coisa sobre eles.\nNão fique confortável."
    ],
    finalFew:[
      "Terminou.\nCom alguns tropeços, mas terminou.\n\nVou considerar aceitável.\nNão confunda aceitável com impressionante.",
      "Três respostas certas.\nAlguns arranhões no caminho.\n\nPassável."
    ],
    finalMany:[
      "Três respostas corretas.\nEventualmente.\n\nForam necessárias tentativas demais para eu chamar isso de conhecimento.\nMas parabéns pela persistência. Imagino.",
      "Conseguiu.\n\nEu não diria que passou no teste.\nDiria que o teste desistiu de você.",
      "Três respostas certas.\nDepois de transformar cada pergunta numa investigação criminal.\n\nClay teria orgulho.\nIsso não é um elogio."
    ],
    finalManyAway:[
      "Finalmente.\n\nTrês respostas certas, várias tentativas e algumas pequenas excursões.\nVocê não passou por conhecimento.\nPassou por insistência.",
      "Terminou.\n\nQuase precisei colocar Clay no caso."
    ],
    confidenceMilk:[
      "Confiante, lembra?\nEnvelheceu igual leite.",
      "Toda aquela confiança para isso?\nEnvelheceu igual leite."
    ],
    finalConfidenceMilk:[
      "Lembra da confiança?\nEu lembro.\n\nEnvelheceu igual leite.\n\nMas você conseguiu.\nEventualmente."
    ]
  };

  const $ = id => document.getElementById(id);
  const quizView = $("quizView");
  const finalView = $("final");
  const card = $("card");
  const questionEl = $("question");
  const form = $("form");
  const answer = $("answer");
  const submit = $("submit");
  const reaction = $("reaction");
  const watchState = $("watchState");
  const finalText = $("finalText");
  const finalStats = $("finalStats");
  const nextBtn = $("nextBtn");
  const nextMessage = $("nextMessage");
  const absence = $("absence");
  const glitchFlash = $("glitchFlash");
  const errorCountEl = $("errorCount");
  const awayCountEl = $("awayCount");

  const sfxClick = $("sfxClick");
  const sfxError = $("sfxError");
  const sfxAccess = $("sfxAccess");

  const confidence = sessionStorage.getItem("phantasma_confianca") || "nao";

  const state = {
    current:0,
    totalErrors:0,
    errorsThisQuestion:0,
    firstErrorQuestion:null,
    totalAwayMs:0,
    awayCount:0,
    awayStartedAt:null,
    awayOnCurrentQuestion:0,
    awayMsCurrentQuestion:0,
    returnedSinceLastAnswer:false,
    lastReturnDuration:0,
    busy:false,
    used:new Set()
  };

  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  const sessionQuestions = shuffle(QUESTIONS).slice(0, Math.min(3, QUESTIONS.length));

  function normalizeText(value){
    return value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/\s+/g," ");
  }

  function validateMoney200k(raw){
    let v = normalizeText(raw).replace(/\breais?\b/g,"").replace(/r\$/g,"").replace(/\s+/g,"");
    if(v === "200mil" || v === "200k") return true;
    return /^200(?:\.?000)(?:,00)?$/.test(v);
  }

  function isCorrect(q, raw){
    if(q.type === "money200k") return validateMoney200k(raw);
    const n = normalizeText(raw);
    return q.accepted.some(x => normalizeText(x) === n);
  }

  function safePlay(audio, volume=.11){
    try{
      audio.pause();
      audio.currentTime=0;
      audio.volume=volume;
      audio.play().catch(()=>{});
    }catch(_){}
  }

  function glitch(){
    glitchFlash.classList.remove("hit");
    void glitchFlash.offsetWidth;
    glitchFlash.classList.add("hit");
  }

  function pick(pool){
    if(!pool || !pool.length) return "";
    let candidates = pool.filter(x => !state.used.has(x));
    if(!candidates.length) candidates = pool;
    const text = candidates[Math.floor(Math.random()*candidates.length)];
    state.used.add(text);
    return text;
  }

  function maybeClay(basePool, chance){
    if(Math.random() < chance) return pick(TAUNTS.clay);
    return pick(basePool);
  }

  function updateSideNumbers(){
    errorCountEl.textContent = `falhas // ${state.totalErrors}`;
    awayCountEl.textContent = `ausências // ${state.awayCount}`;
  }

  function setButtonState(type){
    submit.classList.remove("state-correct","state-wrong");
    if(type==="correct") submit.classList.add("state-correct");
    if(type==="wrong") submit.classList.add("state-wrong");
  }

  function renderQuestion(){
    state.errorsThisQuestion=0;
    state.awayOnCurrentQuestion=0;
    state.awayMsCurrentQuestion=0;
    state.returnedSinceLastAnswer=false;
    state.lastReturnDuration=0;
    state.busy=false;

    const q = sessionQuestions[state.current];
    questionEl.textContent = q.question;
    reaction.textContent = "";
    reaction.className = "";
    answer.value = "";
    answer.disabled = false;
    submit.disabled = false;
    submit.textContent = "VALIDAR";
    setButtonState(null);
    answer.focus();
    watchState.textContent = "observação // ativa";
    updateSideNumbers();
  }

  function wrongReaction(){
    const position = state.current + 1;
    const justReturned = state.returnedSinceLastAnswer;
    const awayLong = state.lastReturnDuration >= 6000;

    state.errorsThisQuestion++;
    state.totalErrors++;

    if(state.firstErrorQuestion === null) state.firstErrorQuestion = position;

    if(justReturned && awayLong){
      state.returnedSinceLastAnswer = false;
      return pick(TAUNTS.awayWrong);
    }

    if(state.totalErrors === 1){
      if(confidence === "sim") return pick(TAUNTS.confidenceMilk);
      if(position === 1) return pick(TAUNTS.firstWrongQ1);
      if(position === 2) return pick(TAUNTS.firstWrongQ2);
      return pick(TAUNTS.firstWrongQ3);
    }

    if(state.errorsThisQuestion === 1){
      if(position === 1) return pick(TAUNTS.firstWrongQ1);
      if(position === 2) return pick(TAUNTS.firstWrongQ2);
      return pick(TAUNTS.firstWrongQ3);
    }

    if(state.errorsThisQuestion === 2) return maybeClay(TAUNTS.secondWrong,.20);
    if(state.errorsThisQuestion === 3) return maybeClay(TAUNTS.thirdWrong,.32);
    return maybeClay(TAUNTS.fourthPlus,.46);
  }

  function correctReaction(){
    const position = state.current + 1;
    const justReturned = state.returnedSinceLastAnswer;
    const awayLong = state.lastReturnDuration >= 6000;

    if(justReturned && awayLong){
      state.returnedSinceLastAnswer = false;
      return pick(TAUNTS.awayCorrect);
    }

    if(state.errorsThisQuestion === 0){
      if(position === 1) return pick(TAUNTS.correctFirst);
      if(position === 2) return pick(TAUNTS.correctSecond);
      return pick(TAUNTS.correctThird);
    }
    if(state.errorsThisQuestion >= 3) return maybeClay(TAUNTS.afterManyErrors,.28);
    return pick(TAUNTS.afterFewErrors);
  }

  function showReaction(text, type){
    reaction.className = type;
    reaction.textContent = text;
  }

  function finish(){
    quizView.classList.add("hidden");
    finalView.classList.add("show");

    let closing;
    if(state.totalErrors === 0){
      closing = pick(TAUNTS.finalPerfect);
    }else if(state.totalErrors <= 2){
      closing = pick(TAUNTS.finalFew);
    }else if((state.awayCount >= 2 || state.totalAwayMs >= 12000) && Math.random() < .72){
      closing = pick(TAUNTS.finalManyAway);
    }else if(confidence === "sim" && state.totalErrors >= 4 && Math.random() < .42){
      closing = pick(TAUNTS.finalConfidenceMilk);
    }else{
      closing = pick(TAUNTS.finalMany);
    }

    finalText.textContent = closing;
    const awaySeconds = Math.round(state.totalAwayMs/1000);
    finalStats.innerHTML =
      `ERROS REGISTRADOS // ${state.totalErrors}<br>` +
      `AUSÊNCIAS REGISTRADAS // ${state.awayCount}` +
      (state.awayCount ? `<br>TEMPO FORA DE FOCO // ~${awaySeconds}s` : "");

    sessionStorage.setItem("phantasma_quiz_concluido","sim");
    sessionStorage.setItem("phantasma_quiz_erros", String(state.totalErrors));
    sessionStorage.setItem("phantasma_quiz_ausencias", String(state.awayCount));
    sessionStorage.setItem("phantasma_quiz_tempo_fora_ms", String(state.totalAwayMs));

    safePlay(sfxAccess,.10);
    glitch();
  }

  function advance(){
    state.current++;
    if(state.current >= sessionQuestions.length){
      finish();
      return;
    }
    renderQuestion();
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    if(state.busy) return;

    const raw = answer.value.trim();
    if(!raw){
      showReaction("Você pretende responder ou só encarar a caixa de texto?","bad");
      setButtonState("wrong");
      submit.textContent = "VAZIO";
      glitch();
      setTimeout(()=>{
        setButtonState(null);
        submit.textContent = "VALIDAR";
      },650);
      return;
    }

    safePlay(sfxClick,.07);
    const q = sessionQuestions[state.current];

    if(isCorrect(q, raw)){
      state.busy = true;
      answer.disabled = true;
      submit.disabled = true;
      setButtonState("correct");
      submit.textContent = "CORRETO";
      showReaction(correctReaction(),"good");
      safePlay(sfxAccess,.08);
      setTimeout(advance, 2800);
    }else{
      setButtonState("wrong");
      submit.textContent = "ERRO";
      showReaction(wrongReaction(),"bad");
      safePlay(sfxError,.075);
      glitch();
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
      answer.value = "";
      updateSideNumbers();

      setTimeout(()=>{
        setButtonState(null);
        submit.textContent = "VALIDAR";
        answer.focus();
      },720);
    }

    state.returnedSinceLastAnswer = false;
  });

  document.addEventListener("visibilitychange", () => {
    if(document.hidden){
      if(state.awayStartedAt === null) state.awayStartedAt = Date.now();
      watchState.textContent = "observação // sinal perdido";
      return;
    }

    if(state.awayStartedAt !== null){
      const duration = Math.max(0, Date.now() - state.awayStartedAt);
      state.awayStartedAt = null;
      state.awayCount++;
      state.awayOnCurrentQuestion++;
      state.awayMsCurrentQuestion += duration;
      state.totalAwayMs += duration;
      state.returnedSinceLastAnswer = true;
      state.lastReturnDuration = duration;
      watchState.textContent = "observação // reestabelecida";
      updateSideNumbers();

      absence.classList.add("show");
      clearTimeout(absence._timer);
      absence._timer = setTimeout(() => absence.classList.remove("show"), 1500);

      if(state.awayOnCurrentQuestion >= 2 && !state.busy){
        setTimeout(() => {
          if(!state.busy) showReaction(pick(TAUNTS.awayRepeated), "bad");
        }, 420);
      }
    }
  });

  window.addEventListener("blur", () => {
    if(!document.hidden && state.awayStartedAt === null){
      state.awayStartedAt = Date.now();
    }
  });

  window.addEventListener("focus", () => {
    if(!document.hidden && state.awayStartedAt !== null){
      const duration = Math.max(0, Date.now() - state.awayStartedAt);
      state.awayStartedAt = null;
      if(duration >= 350){
        state.awayCount++;
        state.awayOnCurrentQuestion++;
        state.awayMsCurrentQuestion += duration;
        state.totalAwayMs += duration;
        state.returnedSinceLastAnswer = true;
        state.lastReturnDuration = duration;
        updateSideNumbers();
      }
    }
  });

  nextBtn.addEventListener("click", () => {
    safePlay(sfxClick,.07);
    if(NEXT_PAGE){
      location.href = NEXT_PAGE;
    }else{
      nextMessage.textContent = "PARTE III // AINDA NÃO CONECTADA";
    }
  });

  // Fundo binário sutil
  const binaryCanvas = document.getElementById("binaryCanvas");
  const bctx = binaryCanvas.getContext("2d");
  let cols = [];
  let stepX = 16;

  function sizeBinary(){
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    binaryCanvas.width = Math.floor(window.innerWidth * dpr);
    binaryCanvas.height = Math.floor(window.innerHeight * dpr);
    binaryCanvas.style.width = window.innerWidth + "px";
    binaryCanvas.style.height = window.innerHeight + "px";
    bctx.setTransform(dpr,0,0,dpr,0,0);

    stepX = Math.max(14, Math.min(20, window.innerWidth / 85));
    const count = Math.floor(window.innerWidth / stepX);
    cols = Array.from({length: count}, () => ({
      y: Math.random() * window.innerHeight,
      speed: 0.9 + Math.random() * 1.8,
      alpha: 0.06 + Math.random() * 0.14,
      size: 12 + Math.random() * 4
    }));
  }

  function drawBinary(){
    bctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    cols.forEach((col, i) => {
      bctx.font = `${col.size}px monospace`;
      bctx.fillStyle = `rgba(145,255,190,${col.alpha})`;
      bctx.fillText(Math.random() > 0.5 ? "1" : "0", i * stepX, col.y);
      col.y += col.speed;
      if(col.y > window.innerHeight + 20){
        col.y = -20;
        col.speed = 0.9 + Math.random() * 1.8;
        col.alpha = 0.06 + Math.random() * 0.14;
      }
    });
    requestAnimationFrame(drawBinary);
  }

  sizeBinary();
  drawBinary();
  window.addEventListener("resize", sizeBinary);

  renderQuestion();
})();
</script>
</body>
</html>
